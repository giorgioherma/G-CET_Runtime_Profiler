name: Build G CET Runtime Profiler C# Port

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build G-CET-Runtime-Profiler.sln -c Release

      - name: Publish win-x64
        run: dotnet publish src/G.CETProfiler.App/G.CETProfiler.App.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Copy docs
        shell: pwsh
        run: |
          Copy-Item README.md publish\README.md
          Copy-Item VERSION.txt publish\VERSION.txt
          New-Item -ItemType Directory -Force publish\RESULTS | Out-Null

      - name: Upload transparent Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: G-CET-Runtime-Profiler-CSharp-Port
          path: publish
