          '@ | Set-Content -LiteralPath (Join-Path $frameRoot 'CompanionManifest.json') -Encoding utf8

          $rebuilt = (& $exe --report --capture $collected.destination --json | ConvertFrom-Json)
          if (!$rebuilt.ok) { throw 'Standalone report rebuild failed.' }
          if (!$rebuilt.hasFrameTimeData) { throw 'CapFrameX data was not detected by the result report.' }

          $reportText = Get-Content -LiteralPath (Join-Path $collected.destination 'CET_Report.html') -Raw
          if ($reportText -notmatch 'CET \+ CapFrameX capture report') { throw 'Report did not enter CET + CapFrameX presentation mode.' }
          if ($reportText -notmatch 'Frametime &amp; CET overlap') { throw 'Report did not render the frametime correlation section.' }
          if ($reportText -notmatch 'Worst frametime events') { throw 'Report did not render worst-frame evidence.' }
          if ($reportText -notmatch 'CPU active') { throw 'Report did not expose CapFrameX CPU Active readings.' }
          if ($reportText -notmatch 'GPU active') { throw 'Report did not expose CapFrameX GPU Active readings.' }
          if ($reportText -notmatch 'Repeatable Cyberpsychos callback spike') { throw 'Worst-frame evidence did not correlate the exact CET callback spike.' }
          if ($reportText -notmatch 'Scheduler burst') { throw 'Worst-frame evidence did not expose the aligned Scheduler burst.' }

          $summary = Get-Content -LiteralPath (Join-Path $collected.destination 'CET_Summary.json') -Raw | ConvertFrom-Json
          if ($null -eq $summary.frameTime) { throw 'CET_Summary.json contains no frameTime section.' }
          if (!$summary.frameTime.sync.correlated) { throw 'Synthetic F11-aligned CapFrameX capture did not correlate.' }
          if ($summary.frameTime.sync.quality -ne 'GOOD') { throw "Expected GOOD CapFrameX sync, got $($summary.frameTime.sync.quality)" }
          if ($summary.frameTime.sync.alignmentMethod -ne 'shared capture-key relative clocks') { throw "Unexpected CapFrameX alignment method: $($summary.frameTime.sync.alignmentMethod)" }
          if ($summary.frameTime.sync.PSObject.Properties.Name -contains 'startDeltaMs') { throw 'Obsolete startDeltaMs field leaked back into CET_Summary.json.' }
          $recordLagMs = [double]$summary.frameTime.sync.recordLagMs
          if ($recordLagMs -lt 1900 -or $recordLagMs -gt 2100) { throw "Expected ~2000 ms CapFrameX record/save lag, got $recordLagMs ms" }
          $cetStartIso = ([datetimeoffset]$summary.frameTime.sync.cetStartUtc).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss')
          if ($cetStartIso -ne '2026-02-02T02:40:00') { throw "CET START marker was not preserved: $cetStartIso" }
          if ($reportText -notmatch 'CapFrameX record/save time') { throw 'Report did not label CapFrameX CreationDate as record/save metadata.' }
          if ([int]$summary.frameTime.correlation.slowFramesExactCallback -lt 1) { throw 'Exact callback/stall overlap was not counted.' }
          if ([int]$summary.frameTime.correlation.slowFramesSchedulerBurst -lt 1) { throw 'Scheduler-burst/stall overlap was not counted.' }

          if (!(Test-Path -LiteralPath (Join-Path $cet 'keep_me.txt') -PathType Leaf)) { throw 'Unrelated CET-directory file was incorrectly deleted.' }

          $restore = (& $exe --restore --game $fixture --json | ConvertFrom-Json)
          if ($restore.status.managed) { throw 'Restore left managed state active.' }

          $restoredInitHash = (Get-FileHash (Join-Path $zero 'init.lua') -Algorithm SHA256).Hash
          if ($restoredInitHash -ne $originalInitHash) { throw 'init.lua did not restore exactly.' }

          if ((Get-Content -LiteralPath (Join-Path $oldControls 'existing.txt') -Raw).Trim() -ne 'KEEP-ME') {
            throw 'Pre-existing CETProfilerControls directory was not restored.'
          }

          $bindings = Get-Content -LiteralPath (Join-Path $cet 'bindings.json') -Raw | ConvertFrom-Json
          if ([int64]$bindings.CETProfilerControls.CETProfiler_Toggle -ne 123) { throw 'Restore changed the user CET capture binding.' }
          if ([int64]$bindings.CETProfilerControls.CETProfiler_Dump -ne 456) { throw 'Restore changed unrelated CETProfilerControls binding data.' }
          if ([int64]$bindings.OtherMod.SomeBinding -ne 77) { throw 'Restore changed unrelated CET binding data.' }
          if (Test-Path -LiteralPath (Join-Path $plugins '.cet_runtime_profiler')) { throw 'Managed state directory remained after restore.' }

          # Core-only path: deliberately unsafe 0-Engine must remain byte-identical.
          $fixture2 = Join-Path $env:RUNNER_TEMP 'gcet-core-only-fixture'
          if (Test-Path $fixture2) { Remove-Item $fixture2 -Recurse -Force }
          $plugins2 = Join-Path $fixture2 'bin\x64\plugins'
          $cet2 = Join-Path $plugins2 'cyber_engine_tweaks'
          $zero2 = Join-Path $cet2 'mods\0-Engine'
          New-Item -ItemType Directory -Force $zero2 | Out-Null
          Copy-Item 'publish\payload\cyber_engine_tweaks.PROFILER.asi' (Join-Path $plugins2 'cyber_engine_tweaks.asi')
          '-- deliberately unsupported custom init' | Set-Content -LiteralPath (Join-Path $zero2 'init.lua') -Encoding utf8
          $coreHash = (Get-FileHash (Join-Path $zero2 'init.lua') -Algorithm SHA256).Hash

          $coreInstall = (& $exe --install --game $fixture2 --core-only --json | ConvertFrom-Json)
          if ($coreInstall.managedMode -ne 'core-only') { throw 'Core-only install did not report core-only mode.' }
          if ((Get-FileHash (Join-Path $zero2 'init.lua') -Algorithm SHA256).Hash -ne $coreHash) { throw 'Core-only mode changed 0-Engine.' }

          & $exe --restore --game $fixture2 --json | Out-Null
          if ((Get-FileHash (Join-Path $zero2 'init.lua') -Algorithm SHA256).Hash -ne $coreHash) { throw 'Core-only restore changed 0-Engine.' }

          # Regression: runtime changes inside profiler-owned files/folders and a
          # user keybind change must NEVER trap the user in managed state.
          $fixture3 = Join-Path $env:RUNNER_TEMP 'gcet-authoritative-restore-fixture'
          if (Test-Path $fixture3) { Remove-Item $fixture3 -Recurse -Force }
          $plugins3 = Join-Path $fixture3 'bin\x64\plugins'
          $cet3 = Join-Path $plugins3 'cyber_engine_tweaks'
          $mods3 = Join-Path $cet3 'mods'
          $zero3 = Join-Path $mods3 '0-Engine'
          New-Item -ItemType Directory -Force (Join-Path $zero3 'modules') | Out-Null
          Copy-Item 'publish\payload\cyber_engine_tweaks.PROFILER.asi' (Join-Path $plugins3 'cyber_engine_tweaks.asi')

          @'
          local Engine = {}
          function Engine.Register(name)
              local Mod = {}
              return Mod
          end
          return Engine
          '@ | Set-Content -LiteralPath (Join-Path $zero3 'init.lua') -Encoding utf8
          $restoreFixtureInitHash = (Get-FileHash (Join-Path $zero3 'init.lua') -Algorithm SHA256).Hash

          @{
            OtherMod = @{ SomeBinding = 88 }
            CETProfilerControls = @{ CETProfiler_Toggle = 234 }
          } | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $cet3 'bindings.json') -Encoding utf8

          $restoreFixtureInstall = (& $exe --install --game $fixture3 --json | ConvertFrom-Json)
          if (!$restoreFixtureInstall.managed) { throw 'Authoritative restore fixture install failed.' }

          # Simulate exactly the class of real-world changes that previously made
          # RESTORE ORIGINAL STATE refuse to run.
          $changedScheduler = Join-Path $zero3 'modules\CETProfilerScheduler.lua'
          '-- runtime/external change after profiler installation' | Set-Content -LiteralPath $changedScheduler -Encoding utf8

          $controls3 = Join-Path $mods3 'CETProfilerControls'
          'runtime-created-or-changed-file' | Set-Content -LiteralPath (Join-Path $controls3 'runtime-change.txt') -Encoding utf8

          $bindings3 = Get-Content -LiteralPath (Join-Path $cet3 'bindings.json') -Raw | ConvertFrom-Json
          $bindings3.CETProfilerControls.CETProfiler_Toggle = 987654321
          $bindings3 | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $cet3 'bindings.json') -Encoding utf8

          $authoritativeRestore = (& $exe --restore --game $fixture3 --json | ConvertFrom-Json)
          if ($authoritativeRestore.status.managed) { throw 'Authoritative restore left managed state active.' }
          if (Test-Path -LiteralPath (Join-Path $plugins3 '.cet_runtime_profiler')) { throw 'Authoritative restore left recovery state behind.' }

          if ((Get-FileHash (Join-Path $zero3 'init.lua') -Algorithm SHA256).Hash -ne $restoreFixtureInitHash) {
            throw 'Authoritative restore did not restore the original 0-Engine init.lua.'
          }
          if (Test-Path -LiteralPath $changedScheduler -PathType Leaf) {
            throw 'Authoritative restore did not remove the profiler-added Scheduler file.'
          }
          if (Test-Path -LiteralPath $controls3 -PathType Container) {
            throw 'Authoritative restore did not remove the profiler-added CETProfilerControls folder after it changed at runtime.'
          }

          $bindingsAfterRestore3 = Get-Content -LiteralPath (Join-Path $cet3 'bindings.json') -Raw | ConvertFrom-Json
          if ([int64]$bindingsAfterRestore3.CETProfilerControls.CETProfiler_Toggle -ne 987654321) {
            throw 'Restore overwrote the keybind selected by the user while profiling.'
          }
          if ([int64]$bindingsAfterRestore3.OtherMod.SomeBinding -ne 88) {
            throw 'Restore changed unrelated CET binding data.'
          }

          # Explicit Scheduler status semantics: PRESENT / INTEGRATED / PROFILER-AWARE.
          $fixture4 = Join-Path $env:RUNNER_TEMP 'gcet-integrated-scheduler-fixture'
          if (Test-Path $fixture4) { Remove-Item $fixture4 -Recurse -Force }
          $plugins4 = Join-Path $fixture4 'bin\x64\plugins'
          $cet4 = Join-Path $plugins4 'cyber_engine_tweaks'
          $zero4 = Join-Path $cet4 'mods\0-Engine'
          New-Item -ItemType Directory -Force (Join-Path $zero4 'modules') | Out-Null
          Copy-Item 'publish\payload\cyber_engine_tweaks.PROFILER.asi' (Join-Path $plugins4 'cyber_engine_tweaks.asi')

          @'
          local Engine = {}
          local Mod = {}
          local Scheduler = require('modules/Scheduler')
          Scheduler.Init(nil, nil)
          Scheduler.Update(nil)
          Engine.Schedule = {}
          Mod.Schedule = {}
          return Engine
          '@ | Set-Content -LiteralPath (Join-Path $zero4 'init.lua') -Encoding utf8

          '-- ordinary pre-existing scheduler' | Set-Content -LiteralPath (Join-Path $zero4 'modules\Scheduler.lua') -Encoding utf8
          $ordinarySchedulerHash = (Get-FileHash (Join-Path $zero4 'modules\Scheduler.lua') -Algorithm SHA256).Hash

          $schedulerBefore = (& $exe --status --game $fixture4 --json | ConvertFrom-Json)
          if (!$schedulerBefore.schedulerPresent) { throw 'Scheduler PRESENT should be YES for the integrated fixture.' }
          if (!$schedulerBefore.schedulerIntegrated) { throw 'Scheduler INTEGRATED should be YES for the integrated fixture.' }
          if ($schedulerBefore.schedulerProfilerAware) { throw 'Ordinary Scheduler incorrectly reported profiler-aware before install.' }

          $integratedInstall = (& $exe --install --game $fixture4 --json | ConvertFrom-Json)
          if ($integratedInstall.managedMode -ne 'integrated') { throw "Expected integrated mode, got $($integratedInstall.managedMode)" }
          if (!$integratedInstall.schedulerPresent) { throw 'Scheduler PRESENT changed unexpectedly after integrated install.' }
          if (!$integratedInstall.schedulerIntegrated) { throw 'Scheduler INTEGRATED changed unexpectedly after integrated install.' }
          if (!$integratedInstall.schedulerProfilerAware) { throw 'Profiler-aware Scheduler was not reported after replacement.' }

          & $exe --restore --game $fixture4 --json | Out-Null
          if ((Get-FileHash (Join-Path $zero4 'modules\Scheduler.lua') -Algorithm SHA256).Hash -ne $ordinarySchedulerHash) {
            throw 'Integrated Scheduler fixture did not restore its original Scheduler.lua.'
          }

          # Regression: CET may create header/template CSVs merely by loading the
          # profiler. Those files are not a completed capture and must not enable
          # collection or create a result archive during restore. Also verify that
          # an actual F11 binding is reported as F11 rather than generic/custom.
          $fixture5 = Join-Path $env:RUNNER_TEMP 'gcet-template-output-fixture'
          if (Test-Path $fixture5) { Remove-Item $fixture5 -Recurse -Force }
          $plugins5 = Join-Path $fixture5 'bin\x64\plugins'
          $cet5 = Join-Path $plugins5 'cyber_engine_tweaks'
          New-Item -ItemType Directory -Force $cet5 | Out-Null
          Copy-Item 'publish\payload\cyber_engine_tweaks.PROFILER.asi' (Join-Path $plugins5 'cyber_engine_tweaks.asi')

          @{
            CETProfilerControls = @{ CETProfiler_Toggle = 34339947158700032 }
          } | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $cet5 'bindings.json') -Encoding utf8

          $templateInstall = (& $exe --install --game $fixture5 --json | ConvertFrom-Json)
          if (!$templateInstall.managed) { throw 'Template-output fixture install failed.' }

          $templateFiles = @{
            'CET_Runtime_Profile_ByMod.csv' = 'Mod,Calls,CallsPerSecond'
            'CET_Runtime_Profile_ByModKind.csv' = 'Mod,Kind,Calls'
            'CET_Runtime_Profile_Detail.csv' = 'Mod,Kind,Target,Calls'
            'CET_Runtime_Profile_Spikes.csv' = 'Sequence,CaptureStartMs,CaptureEndMs'
            'CET_Runtime_Profile_Timeline.csv' = 'BucketIndex,BucketStartMs,BucketEndMs'
            'CET_Runtime_Profile_Markers.csv' = 'Sequence,CaptureMs,UnixEpochMs,Label,DroppedMarkersAtDump'
            'CET_Runtime_Profile_Scheduler_ByJob.csv' = 'Owner,JobType,Job'
            'CET_Runtime_Profile_Scheduler_Spikes.csv' = 'Sequence,Frame,DurationMs'
            'CET_Runtime_Profile_Scheduler_FrameBursts.csv' = 'Sequence,Frame,TotalJobMs'
          }
          foreach ($entry in $templateFiles.GetEnumerator()) {
            $entry.Value | Set-Content -LiteralPath (Join-Path $cet5 $entry.Key) -Encoding utf8
          }

          $templateStatus = (& $exe --status --game $fixture5 --json | ConvertFrom-Json)
          if ([int]$templateStatus.liveResultCount -ne 9) { throw "Expected 9 profiler template files, got $($templateStatus.liveResultCount)." }
          if ($templateStatus.captureReadyForCollection) { throw 'Header-only profiler templates were incorrectly classified as a completed capture.' }
          if ($templateStatus.captureKey -ne 'F11') { throw "Expected CET capture key F11, got $($templateStatus.captureKey)." }
          if (!$templateStatus.captureKeyIsDefaultF11) { throw 'Exact F11 binding was not recognized as the default capture key.' }

          $resultsBeforeTemplateRestore = @(Get-ChildItem 'publish\RESULTS' -Directory -ErrorAction SilentlyContinue).Count
          $templateRestore = (& $exe --restore --game $fixture5 --json | ConvertFrom-Json)
          if ($templateRestore.status.managed) { throw 'Template-output restore left managed state active.' }
          if ([int]$templateRestore.status.liveResultCount -ne 0) { throw 'Template-output restore did not clear profiler-owned CSV shells.' }
          if ($templateRestore.status.captureReadyForCollection) { throw 'Capture remained collectable after template-only restore.' }

          foreach ($name in $templateFiles.Keys) {
            if (Test-Path -LiteralPath (Join-Path $cet5 $name) -PathType Leaf) {
              throw "Template-output restore left profiler-owned file behind: $name"
            }
          }

          $resultsAfterTemplateRestore = @(Get-ChildItem 'publish\RESULTS' -Directory -ErrorAction SilentlyContinue).Count
          if ($resultsAfterTemplateRestore -ne $resultsBeforeTemplateRestore) {
            throw 'Template-only restore incorrectly created a collected result archive.'
          }

          # Smoke tests use the package-local RESULTS path; do not ship their fixtures.
          Remove-Item publish\RESULTS -Recurse -Force
          New-Item -ItemType Directory -Force publish\RESULTS | Out-Null
          @'
          G-CET Runtime Profiler stores collected captures in this folder.

          Capture folders are created automatically by COLLECT RESULTS.
          '@ | Set-Content -LiteralPath publish\RESULTS\README.txt -Encoding utf8

          Write-Host 'C# lifecycle integration smoke test passed.'

      - name: Alpha6b resolver and handoff regression contract
        shell: pwsh
        run: ./tests/ResolverHandoffContract.ps1 -PublishedRoot ./publish

      - name: Stage portable release ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portableRoot = 'portable'
          $productRoot = Join-Path $portableRoot 'G-CET-Runtime-Profiler'
          if (Test-Path $portableRoot) { Remove-Item $portableRoot -Recurse -Force }
          New-Item -ItemType Directory -Force $productRoot | Out-Null

          Copy-Item publish\* $productRoot -Recurse -Force

          $instructions = Join-Path $portableRoot 'Install_Instructions.html'
          Copy-Item Install_Instructions.html $instructions -Force
          if (!(Test-Path -LiteralPath $instructions -PathType Leaf)) {
            throw 'Install_Instructions.html is missing from the portable release root.'
          }

          $asset = "G-CET-Runtime-Profiler-v$env:PRODUCT_VERSION.zip"
          if (Test-Path $asset) { Remove-Item $asset -Force }
          Compress-Archive -Path $productRoot,$instructions -DestinationPath $asset -CompressionLevel Optimal

          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Encoding ASCII "$asset.sha256.txt"

          "PUBLIC_ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PUBLIC_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Portable release: $asset"
          Write-Host "SHA256: $hash"

      - name: Upload portable Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: G-CET-Runtime-Profiler-v${{ steps.product_version.outputs.version }}
          path: portable/
          if-no-files-found: error

      - name: Publish canonical GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = "v$env:PRODUCT_VERSION"
          $repo = $env:GITHUB_REPOSITORY
          $sha = $env:GITHUB_SHA
          $releaseNotes = Join-Path $env:RUNNER_TEMP "gcet-release-notes-$env:PRODUCT_VERSION.md"

          if (!(Test-Path -LiteralPath $env:PUBLIC_ASSET -PathType Leaf)) {
            throw "Release ZIP is missing: $env:PUBLIC_ASSET"
          }
          if (!(Test-Path -LiteralPath "$env:PUBLIC_ASSET.sha256.txt" -PathType Leaf)) {
            throw "Release SHA-256 file is missing: $env:PUBLIC_ASSET.sha256.txt"
          }

          $tagRefJson = & gh api "repos/$repo/git/ref/tags/$tag" 2>$null
          $tagExists = $LASTEXITCODE -eq 0
          if ($tagExists) {
            $tagRef = $tagRefJson | ConvertFrom-Json
            $tagSha = [string]$tagRef.object.sha
            if ($tagSha -ne $sha) {
              Write-Host "Release tag $tag already exists at $tagSha; leaving it unchanged. Bump VERSION.txt for a new release."
              exit 0
            }
          }
          else {
            Write-Host "Creating release tag $tag at $sha."
            & gh api --method POST "repos/$repo/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" *> $null
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create tag $tag at $sha."
            }
          }

          $notes = (Get-Content -LiteralPath RELEASE_NOTES.md -Raw).TrimEnd()
          $releaseBody =
            $notes +
            "`r`n`r`n## SHA-256`r`n`r`n" +
            "    $env:PUBLIC_SHA256  $env:PUBLIC_ASSET`r`n"
          $releaseBody | Set-Content -LiteralPath $releaseNotes -Encoding utf8

          & gh release view $tag --repo $repo *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            & gh release edit $tag --repo $repo --title "G-CET Runtime Profiler v$env:PRODUCT_VERSION" --notes-file $releaseNotes --target $sha --latest
          }
          else {
            & gh release create $tag --repo $repo --title "G-CET Runtime Profiler v$env:PRODUCT_VERSION" --notes-file $releaseNotes --target $sha --latest
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create/update GitHub release $tag."
          }

          & gh release upload $tag $env:PUBLIC_ASSET "$env:PUBLIC_ASSET.sha256.txt" --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Could not upload canonical release assets for $tag."
          }

          Write-Host "Published canonical release $tag from commit $sha"
          Write-Host "Release asset SHA256: $env:PUBLIC_SHA256"
