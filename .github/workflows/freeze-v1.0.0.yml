name: Publish frozen v1.0.0 release

permissions:
  contents: write
  actions: read

on:
  push:
    branches: [ main ]
    paths:
      - '.github/FROZEN_V1_RELEASE'
  workflow_dispatch:

jobs:
  publish-frozen-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify frozen Actions artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "10880038160"
          EXPECTED_SHA256: "8f35cb5f2044ad9dc2ab8352d761b7fe689ac53c4894c8067e10fdf71a7a27d0"
          ASSET_NAME: "G-CET-Runtime-Profiler-v1.0.0.zip"
        run: |
          set -euo pipefail
          curl -L --fail             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"             -o "$ASSET_NAME"
          actual="$(sha256sum "$ASSET_NAME" | awk '{print $1}')"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "Frozen artifact hash mismatch: expected $EXPECTED_SHA256, got $actual" >&2
            exit 1
          fi
          printf '%s  %s\n' "$actual" "$ASSET_NAME" > "$ASSET_NAME.sha256.txt"

      - name: Publish exact frozen artifact to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: "v1.0.0"
          FROZEN_SHA: "ec0bfd0954ce10d39eebe86f38ef3f14e21f65f4"
          ASSET_NAME: "G-CET-Runtime-Profiler-v1.0.0.zip"
          RELEASE_TITLE: "G-CET Runtime Profiler v1.0.0"
          NOTES_FILE: "RELEASE_NOTES.md"
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          if gh api "repos/$repo/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$repo/git/refs/tags/$TAG" -f sha="$FROZEN_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/$repo/git/refs" -f ref="refs/tags/$TAG" -f sha="$FROZEN_SHA" >/dev/null
          fi

          if gh release view "$TAG" --repo "$repo" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$repo" --title "$RELEASE_TITLE" --notes-file "$NOTES_FILE" --target "$FROZEN_SHA" --latest
          else
            gh release create "$TAG" --repo "$repo" --title "$RELEASE_TITLE" --notes-file "$NOTES_FILE" --target "$FROZEN_SHA" --latest
          fi

          gh release upload "$TAG" "$ASSET_NAME" "$ASSET_NAME.sha256.txt" --repo "$repo" --clobber
