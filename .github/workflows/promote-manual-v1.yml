name: Refresh v1.0.0 release notes

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    paths:
      - '.github/PROMOTE_MANUAL_V1'

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh release body without touching assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="G-CET-Runtime-Profiler-v1.0.0.zip"
          digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" --jq '.assets[] | select(.name=="'"$asset"'") | .digest')"
          hash="${digest#sha256:}"
          test -n "$hash"

          cp RELEASE_NOTES.md release-notes.md
          printf '\n\n## SHA-256\n\n    %s  %s\n' "$hash" "$asset" >> release-notes.md

          gh release edit v1.0.0             --repo "$GITHUB_REPOSITORY"             --title "G-CET Runtime Profiler v1.0.0"             --notes-file release-notes.md             --latest
