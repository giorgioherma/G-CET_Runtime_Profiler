name: Updated Immersive Third Person Resolver Regression

on:
  push:
    branches:
      - dev/itpp-20261016-upstream-source-compat
  workflow_dispatch:

permissions:
  contents: read

jobs:
  itpp-upstream:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Resolver and semantic source injectors
        run: dotnet build G-CET-Runtime-Profiler.sln -c Release
      - name: Validate semantic production catalog
        shell: pwsh
        run: |
          ./tests/SemanticModPassOwnershipContract.ps1
          ./tests/SemanticLibraryContract.ps1
      - name: Publish standalone Resolver for updated ITP source test
        run: dotnet publish src/G.CETResolver.App/G.CETResolver.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o publish-resolver
      - name: Test prior ITP v1/v2 action routing and drift
        shell: pwsh
        run: ./tests/ImmersiveThirdPersonActionRoutingContract.ps1 -ResolverRoot ./publish-resolver
      - name: Test updated ITP two-rule source generation and idempotence
        shell: pwsh
        run: ./tests/ImmersiveThirdPersonUpstream20261016Contract.ps1 -ResolverRoot ./publish-resolver
