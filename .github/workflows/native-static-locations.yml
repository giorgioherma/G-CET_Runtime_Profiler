name: Experimental RED4ext Static Location Service

# Independent from pinned Profiler native CI and normal Profiler/Resolver CI.
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [dev/native-static-anchors-experimental]
    paths:
      # Build only on code/interface/test changes. Documentation-only edits
      # must not recompile the native DLL or trigger product CI.
      - 'native-static-locations/src/**'
      - 'native-static-locations/include/**'
      - 'native-static-locations/tools/**'
      - 'native-static-locations/tests/**'
      - 'native-static-locations/adapters/**'
      - 'native-static-locations/examples/**'
      - 'native-static-locations/CMakeLists.txt'
      - '.github/workflows/native-static-locations.yml'

jobs:
  native-core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate manifest compiler
        run: python -m unittest discover -s native-static-locations/tests -p 'test_*.py' -v
      - name: Exercise source-independent CET native consumer bridge
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          lua5.4 native-static-locations/tests/CETStaticLocationConsumerTests.lua
          lua5.4 native-static-locations/tests/CETNativeJobGateTests.lua
          lua5.4 native-static-locations/tests/CETAnchorSetGateTests.lua
          lua5.4 native-static-locations/tests/CETNativeWakeHostTests.lua
          lua5.4 native-static-locations/tests/LegacyR4NativeCacheBridgeTests.lua
      - name: Compile deterministic sample data
        run: python native-static-locations/tools/compile_locations.py native-static-locations/examples/sample-installed-only.json ${{ runner.temp }}/G-CET.locations
      - name: Build and execute allocation-bounded spatial index tests
        run: |
          cmake -S native-static-locations -B build/static-locations -DCMAKE_BUILD_TYPE=Release -DGCET_BUILD_PLUGIN=OFF
          cmake --build build/static-locations --parallel 2
          ctest --test-dir build/static-locations --output-on-failure
          build/static-locations/gcet_static_core_test '${{ runner.temp }}/G-CET.locations'

  plugin-windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile RED4ext DLL against pinned SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S native-static-locations -B build/static-locations -A x64 -DGCET_BUILD_PLUGIN=ON
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed' }
          cmake --build build/static-locations --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'RED4ext plugin build failed' }
          ctest --test-dir build/static-locations -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Native core tests failed' }
      - name: Stage isolated native payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = 'build/static-locations/Release/GCETStaticLocations.dll'
          if (!(Test-Path -LiteralPath $dll -PathType Leaf)) { throw "Missing DLL: $dll" }
          $root = 'native-static-payload/red4ext/plugins/G-CET-StaticLocations'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item -LiteralPath $dll -Destination "$root/GCETStaticLocations.dll"
          $sha = (Get-FileHash -LiteralPath "$root/GCETStaticLocations.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  GCETStaticLocations.dll" | Set-Content "$root/SHA256.txt" -Encoding ascii
          $verify = (Get-FileHash -LiteralPath "$root/GCETStaticLocations.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $verify) { throw 'Native payload mismatch' }
          Copy-Item native-static-locations/PAYLOAD-README.md -Destination native-static-payload/README.md
          Write-Host "RED4ext service compiled and verified: $sha"
      - name: Upload RED4ext native payload (experimental)
        uses: actions/upload-artifact@v4
        with:
          name: gcet-static-native-experimental
          path: native-static-payload/
          if-no-files-found: error
      - name: Upload SDK interface sources for developer reference
        uses: actions/upload-artifact@v4
        with:
          name: gcet-static-native-dev-interface
          path: |
            native-static-locations/examples/G-CET-StaticLocations.reds
            native-static-locations/examples/sample-installed-only.json
          if-no-files-found: error
