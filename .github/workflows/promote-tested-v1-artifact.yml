name: Promote tested v1.0.0 artifact

permissions:
  actions: read
  contents: write

on:
  push:
    branches: [ main ]
    paths:
      - '.github/PROMOTE_TESTED_V1_ARTIFACT'

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download tested Actions artifact
        uses: actions/download-artifact@v4
        with:
          name: G-CET-Runtime-Profiler-v1.0.0
          run-id: 36200672216
          github-token: ${{ github.token }}
          path: tested-artifact

      - name: Publish tested v1.0.0 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: "089d3f014704153d2f433e84e469252978ae3c87"
          ASSET_NAME: "G-CET-Runtime-Profiler-v1.0.0.zip"
        run: |
          set -euo pipefail

          test -d tested-artifact/G-CET-Runtime-Profiler
          (cd tested-artifact && zip -qr "../$ASSET_NAME" G-CET-Runtime-Profiler)

          actual="$(sha256sum "$ASSET_NAME" | awk '{print $1}')"
          printf '%s  %s\n' "$actual" "$ASSET_NAME" > "$ASSET_NAME.sha256.txt"

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.0.0"             -f sha="$SOURCE_SHA" -F force=true >/dev/null

          cp RELEASE_NOTES.md release-notes.md
          printf '\n\n## SHA-256\n\n    %s  %s\n' "$actual" "$ASSET_NAME" >> release-notes.md

          gh release edit v1.0.0             --repo "$GITHUB_REPOSITORY"             --title "G-CET Runtime Profiler v1.0.0"             --notes-file release-notes.md             --target "$SOURCE_SHA"             --latest

          gh release upload v1.0.0             "$ASSET_NAME" "$ASSET_NAME.sha256.txt"             --repo "$GITHUB_REPOSITORY" --clobber
