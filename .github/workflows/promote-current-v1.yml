name: Promote current v1.0.0

permissions:
  actions: read
  contents: write

on:
  push:
    branches: [ main ]
    paths:
      - '.github/PROMOTE_CURRENT_V1'

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: 089d3f014704153d2f433e84e469252978ae3c87

      - name: Wait for validated source build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: "36200553904"
        run: |
          set -euo pipefail
          for i in {1..90}; do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .status)"
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion // ""')"
            echo "source build: $status $conclusion"
            if [ "$status" = "completed" ]; then
              [ "$conclusion" = "success" ] || { echo "Source build did not succeed"; exit 1; }
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for source build"
          exit 1

      - name: Download validated portable artifact
        uses: actions/download-artifact@v4
        with:
          name: G-CET-Runtime-Profiler-v1.0.0
          run-id: 36200553904
          github-token: ${{ github.token }}
          path: artifact

      - name: Publish v1.0.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: 089d3f014704153d2f433e84e469252978ae3c87
        run: |
          set -euo pipefail
          test -d "artifact/G-CET-Runtime-Profiler"

          rm -f "G-CET-Runtime-Profiler-v1.0.0.zip" "G-CET-Runtime-Profiler-v1.0.0.zip.sha256.txt"
          (cd artifact && zip -qr "../G-CET-Runtime-Profiler-v1.0.0.zip" "G-CET-Runtime-Profiler")
          sha256sum "G-CET-Runtime-Profiler-v1.0.0.zip" > "G-CET-Runtime-Profiler-v1.0.0.zip.sha256.txt"

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.0.0" \
            -f sha="$SOURCE_SHA" -F force=true >/dev/null

          {
            cat "RELEASE_NOTES.md"
            printf '\n\n## SHA-256\n\n    '
            cat "G-CET-Runtime-Profiler-v1.0.0.zip.sha256.txt"
          } > release-notes.md

          gh release edit v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --title "G-CET Runtime Profiler v1.0.0" \
            --notes-file release-notes.md \
            --target "$SOURCE_SHA" \
            --latest

          gh release upload v1.0.0 \
            "G-CET-Runtime-Profiler-v1.0.0.zip" \
            "G-CET-Runtime-Profiler-v1.0.0.zip.sha256.txt" \
            --repo "$GITHUB_REPOSITORY" --clobber
