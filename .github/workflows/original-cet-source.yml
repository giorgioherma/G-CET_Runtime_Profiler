name: Original CET Source Generation

on:
  workflow_call:
    secrets:
      GCET_STACK_SOURCES_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-source-pass:
    name: Generate from untouched CET sources
    runs-on: windows-latest
    steps:
      - name: Checkout Resolver
        uses: actions/checkout@v4

      - name: Checkout private untouched stack
        uses: actions/checkout@v4
        with:
          repository: giorgioherma/original_cet_source
          ref: main
          token: ${{ secrets.GCET_STACK_SOURCES_TOKEN }}
          persist-credentials: false
          path: ci-private-stack

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generated Lua structural checker fixture contract
        run: node tests/ValidateGeneratedLuaInvariantsContract.cjs

      - name: Build actual Resolver
        shell: pwsh
        run: dotnet publish src/G.CETResolver.App/G.CETResolver.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o ci-resolver

      - name: Import the main build's verified native location service
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Same pinned native service and checksum contract as build.yml.
          $sourceSha = '71aace123a2fb77bbf5a50386a34dcd308606c5c'
          $endpoint = 'repos/${{ github.repository }}/actions/workflows/native-static-locations.yml/runs?branch=dev%2Fnative-fixed-cache-player-state&per_page=100'
          $runs = (& gh api $endpoint | ConvertFrom-Json).workflow_runs
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_RUNTIME_INPUT_MISSING: cannot query pinned service CI runs' }
          $matched = @($runs | Where-Object {
            $_.head_sha -eq $sourceSha -and $_.status -eq 'completed' -and $_.conclusion -eq 'success'
          } | Sort-Object run_started_at -Descending)
          if ($matched.Count -lt 1) { throw 'NATIVE_RUNTIME_INPUT_MISSING: pinned native service CI run not available' }
          $runId = [string]$matched[0].id
          gh run download $runId --repo ${{ github.repository }} --name gcet-static-native-experimental --dir native-location-from-ci
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_RUNTIME_INPUT_MISSING: cannot download native service artifact' }
          $root = 'native-location-from-ci/red4ext/plugins/G-CET-StaticLocations'
          $dll = Join-Path $root 'GCETStaticLocations.dll'
          $sidecar = Join-Path $root 'SHA256.txt'
          if (!(Test-Path $dll -PathType Leaf) -or !(Test-Path $sidecar -PathType Leaf)) {
            throw 'NATIVE_RUNTIME_INPUT_MISSING: pinned DLL or checksum missing'
          }
          $actual = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = (Get-Content $sidecar -Raw).Trim().ToLowerInvariant()
          if (!$expected.StartsWith("$actual ")) { throw 'NATIVE_RUNTIME_HASH_MISMATCH' }
          $dest = 'ci-resolver/runtime/native'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item $dll (Join-Path $dest 'GCETStaticLocations.dll')

      - name: Generate one complete pass from original CET
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stack = Join-Path $env:GITHUB_WORKSPACE 'ci-private-stack'
          $mods = Join-Path $stack 'bin/x64/plugins/cyber_engine_tweaks/mods'
          $capture = Join-Path $stack 'capture'
          $engine = Join-Path $mods '0-Engine/init.lua'
          $handoff = Join-Path $capture 'CET_Resolver_Input.json'
          if (!(Test-Path -LiteralPath $engine)) {
            throw "MISSING_REQUIRED_ORIGINAL: bin/x64/plugins/cyber_engine_tweaks/mods/0-Engine/init.lua"
          }
          if (!(Test-Path -LiteralPath $handoff)) {
            throw 'BASE_CAPTURE_MISSING: capture/CET_Resolver_Input.json'
          }
          $zip = Join-Path $env:RUNNER_TEMP 'gcet-original-pass.zip'
          $manifest = Join-Path $env:RUNNER_TEMP 'gcet-original-pass.json'
          # Capture the machine-readable Resolver failure reason for CI triage.
          # No private source code or full capture file is uploaded or displayed.
          $result = Join-Path $env:RUNNER_TEMP 'gcet-original-run.json'
          & './ci-resolver/G-CET-Resolver.exe' --capture $capture --mods $mods --generate-pass --pass-output $zip --json *> $result
          if ($LASTEXITCODE -ne 0) {
            $diagnosis = 'Resolver exited without a parseable error reason.'
            foreach ($line in @(Get-Content -LiteralPath $result -ErrorAction SilentlyContinue)) {
              try {
                $record = $line | ConvertFrom-Json -ErrorAction Stop
                if ($record.ok -eq $false -and ![string]::IsNullOrWhiteSpace([string]$record.error)) {
                  $diagnosis = [string]$record.error
                  break
                }
              } catch { }
            }
            # Keep public Actions diagnostics small; do not emit private source excerpts.
            $diagnosis = ($diagnosis -replace '[\r\n]+', ' ' -replace '::', ':').Trim()
            if ($diagnosis.Length -gt 400) { $diagnosis = $diagnosis.Substring(0, 400) + '...' }
            Write-Host "::error title=Resolver original-source generation failed::$diagnosis"
            @(
              '### Original CET generation — Resolver failure'
              ''
              'Stage: **production Resolver generation**'
              ''
              'Reason: ' + $diagnosis
              ''
              'Next: inspect the existing generating stage using the reported failure reason; do not add a repair-only semantic.'
            ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            throw 'RESOLVER_ORIGINAL_GENERATION_FAILED: see specific reason above'
          }
          if (!(Test-Path -LiteralPath $zip) -or !(Test-Path -LiteralPath $manifest)) {
            throw 'RESOLVER_OUTPUT_MISSING: expected generated ZIP and manifest'
          }
          $output = Join-Path $env:RUNNER_TEMP 'gcet-original-overlay'
          Expand-Archive -LiteralPath $zip -DestinationPath $output -Force
          node tests/ValidateOriginalStackPass.cjs $mods $output $manifest
          if ($LASTEXITCODE -ne 0) {
            throw 'ORIGINAL_STACK_OUTPUT_CHECK_FAILED: see precise CI errors above'
          }
          node tests/ValidateGeneratedLuaInvariants.cjs $output
          if ($LASTEXITCODE -ne 0) {
            throw 'ORIGINAL_STACK_LUA_INVARIANT_FAILED: see precise CI errors above'
          }

          # Check the real composed source behavior without exposing private Lua.
          $minimapAuthor = Join-Path $mods 'Minimap Widgets/init.lua'
          if (Test-Path -LiteralPath $minimapAuthor -PathType Leaf) {
            $authorText = Get-Content -LiteralPath $minimapAuthor -Raw
            if ($authorText.Contains('CreateMappinUIProfile') -and
                $authorText.Contains("TweakDBID.new('MinimapMappinUIProfile.Default')")) {
              $minimapOutput = Join-Path $output 'bin/x64/plugins/cyber_engine_tweaks/mods/Minimap Widgets/init.lua'
              if (!(Test-Path -LiteralPath $minimapOutput -PathType Leaf)) {
                throw 'MINIMAP_PROFILE_OUTPUT_MISSING: untouched source has no generated profile stage'
              }
              $produced = Get-Content -LiteralPath $minimapOutput -Raw
              if (([regex]::Matches($produced, 'local __gcetMinimapProfileIdsV1 = \{\}')).Count -ne 1 -or
                  ([regex]::Matches($produced, 'local function __gcetMinimapProfileIdV1\(')).Count -ne 1 -or
                  !$produced.Contains("__gcetMinimapProfileIdV1('MinimapMappinUIProfile.Default')") -or
                  !$produced.Contains('MappinUIProfile.Create') -or
                  !$produced.Contains("Enum.new('gamedataMappinVariant'") -or
                  $produced.Contains("local defaultRuntimeProfile = TweakDBID.new('MinimapMappinUIProfile.Default')")) {
                throw 'MINIMAP_PROFILE_STAGE_INCOMPLETE: ID reuse, pin constructors or variant checks lost'
              }
              Write-Host 'Minimap profile IDs and pin constructors preserved from untouched source'
            }
          }

          # Verify actual produced source for both camera owners. No private
          # original content is published or included in workflow artifacts.
          $ifpAuthor = Join-Path $mods 'ImmersiveFirstPerson/Modules/CameraCore.lua'
          if (Test-Path -LiteralPath $ifpAuthor -PathType Leaf) {
            $author = Get-Content -LiteralPath $ifpAuthor -Raw
            if ($author.Contains('function CameraCore.EvaluateBody(nativePitch, crouching)') -and
                $author.Contains('local freeOffset = {')) {
              $outputCamera = Join-Path $output 'bin/x64/plugins/cyber_engine_tweaks/mods/ImmersiveFirstPerson/Modules/CameraCore.lua'
              if (!(Test-Path -LiteralPath $outputCamera)) {
                throw 'IFP_CAMERA_SCRATCH_OUTPUT_MISSING: original realtime camera not generated'
              }
              $actual = Get-Content -LiteralPath $outputCamera -Raw
              if (!$actual.Contains('local __gcetIfpBodyScratchV1 = {}') -or
                  !$actual.Contains('local __gcetIfpNeutralFreeV1 = {') -or
                  !$actual.Contains('function CameraCore.EvaluateBody(nativePitch, crouching, out)') -or
                  !$actual.Contains('out = out or {}') -or
                  !$actual.Contains('local freeOffset = __gcetIfpNeutralFreeV1') -or
                  !$actual.Contains('freeOffset = CameraCore.EvaluateFreeLook(')) {
                throw 'IFP_CAMERA_SCRATCH_INCOMPLETE: public API or active FreeLook path changed'
              }
              Write-Host 'IFP original camera source: private arithmetic reuse and active FreeLook path verified'
            }
          }
          $itpAuthor = Join-Path $mods 'immersive_third_person/init.lua'
          if (Test-Path -LiteralPath $itpAuthor -PathType Leaf) {
            $author = Get-Content -LiteralPath $itpAuthor -Raw
            if ($author.Contains('local function makeTweakDBID(value)') -and
                $author.Contains('mod.pluginHeartbeat(delta)') -and
                $author.Contains('makeTweakDBID("AttachmentSlots.TppHead")')) {
              $outputCamera = Join-Path $output 'bin/x64/plugins/cyber_engine_tweaks/mods/immersive_third_person/init.lua'
              if (!(Test-Path -LiteralPath $outputCamera)) {
                throw 'ITP_LITERAL_IDS_OUTPUT_MISSING: original updated camera was not generated'
              }
              $actual = (Get-Content -LiteralPath $outputCamera -Raw).Replace("`r`n","`n")
              if (!$actual.Contains('local __gcetItppLiteralTweakIdsV1 = {}') -or
                  !$actual.Contains('local __gcetItppLiteralKeySetV1 = {') -or
                  !$actual.Contains('if __gcetItppLiteralKeySetV1[value] then') -or
                  !$actual.Contains('return TweakDBID.new(value)') -or
                  !$actual.Contains('return value') -or
                  !$actual.Contains('mod.pluginHeartbeat(delta)') -or
                  !$actual.Contains('mod.updateMove360Step, delta')) {
                throw 'ITP_LITERAL_IDS_INCOMPLETE: native constructor fallback or update paths changed'
              }
              if ($author.Contains('mod.nativeSettingsSaveTick = function(delta)') -and
                  $author.Contains('mod.pollNativeToggle = function(delta)') -and
                  $author.Contains('mod.applyConsumableTiming("FPP", "init")')) {
                $worker = Join-Path $output 'bin/x64/plugins/cyber_engine_tweaks/mods/immersive_third_person/GCET_Semantic/itp_frame_dormancy.lua'
                if (!(Test-Path -LiteralPath $worker)) { throw 'ITP_IDLE_WORKER_MISSING: untouched source must create pausable owner' }
                $code = Get-Content -LiteralPath $worker -Raw
                if (!$actual.Contains('__gcetItppDormantFrameV1') -or
                    !$actual.Contains('local function __gcetItppFrameStepV1(delta)') -or
                    !$actual.Contains('-- __gcetItppSessionRestoreBoundedV1:') -or
                    !$actual.Contains('-- __gcetItppReloadMenuCacheV1:') -or
                    !$actual.Contains('mod.gcetItppForgetSessionUi = function()') -or
                    !$actual.Contains('  mod.gcetItppForgetSessionUi()' + [char]10 +
                      '  mod.captureConsumableTiming()') -or
                    !$actual.Contains('  mod.gcetItppForgetSessionUi()' + [char]10 +
                      '  state.frameSeq = (state.frameSeq or 0) + 1') -or
                    !$actual.Contains("watch('LoadGameMenuGameController', 'LoadGame', function(_, item)" + [char]10 +
                      '  mod.gcetItppForgetSessionUi()') -or
                    !$actual.Contains('    mod.gcetItppForgetSessionUi()' + [char]10 +
                      '    if menu.m_isModded') -or
                    !$actual.Contains('state.uiBb, state.uiInMenuId = nil, nil') -or
                    !$actual.Contains('state.inMenuSeq, state.inMenuCached = nil, nil') -or
                    !$actual.Contains('state.menuHeld, state.menuWasOpen = false, false') -or
                    !$actual.Contains('state.uiReadyAt = nil') -or
                    !$actual.Contains('    if hardCapped and not ready then' + [char]10 +
                      '      state.pendingSessionTppRestore = nil') -or
                    $actual.IndexOf('-- __gcetItppSessionRestoreBoundedV1:') -gt
                      $actual.IndexOf('    if pending.stablePolls >= 10 or (hardCapped and ready) then') -or
                    !$actual.Contains('mod.__gcetItppDormancyV1.Start()') -or
                    !$actual.Contains('mod.__gcetItppDormancyV1.Stop()') -or
                    !$actual.Contains('mod.__gcetItppDormancyV1.Signal("toggle")') -or
                    !$actual.Contains('if not __gcetItppWorkerFactoryV3 then') -or
                    !$actual.Contains('local __gcetItppAttachOnInitV3' + [char]10 + 'registerForEvent("onInit", function()') -or
                    !$actual.Contains('__gcetItppAttachOnInitV3 = function()') -or
                    $actual.Contains('local function __gcetItppAttachOnInitV3()') -or
                    !$actual.Contains('local ready = controller.Register()') -or
                    !$actual.Contains('host.__gcetScheduleDriver') -or
                    $actual.Contains('pcall(controller.Register)') -or
                    !$code.Contains('handle.Pause()') -or
                    !$code.Contains('handle.Resume()') -or
                    !$code.Contains('nativeKeyFallback = hasNativeBindings()') -or
                    !$code.Contains('id="itp.frame"') -or
                    !$code.Contains('function M.Register()') -or
                    !$code.Contains('active=false') -or
                    !$actual.Contains('mod.loadModule("GCET_Semantic/itp_frame_dormancy")') -or
                    $actual.Contains('return dofile("GCET_Semantic/itp_frame_dormancy.lua").Install') -or
                    !$actual.Contains('[G-CET ITP] detached frame fallback:') -or
                    !$actual.Contains('  __gcetItppAttachOnInitV3()' + "`n" +
                      '  if mod.__gcetItppDormancyV1 then mod.__gcetItppDormancyV1.Start() end' + "`n" + 'end)') -or
                    $actual.IndexOf('local ready = controller.Register()', [StringComparison]::Ordinal) -gt
                      $actual.IndexOf('local UI = {',[StringComparison]::Ordinal) -or
                    $actual.IndexOf('local ready = controller.Register()', [StringComparison]::Ordinal) -lt
                      $actual.IndexOf('__gcetItppAttachOnInitV3 = function()', [StringComparison]::Ordinal) -or
                    $actual.IndexOf('local __gcetItppAttachOnInitV3' + [char]10, [StringComparison]::Ordinal) -gt
                      $actual.IndexOf('registerForEvent("onInit", function()', [StringComparison]::Ordinal) -or
                    $actual.IndexOf('  __gcetItppAttachOnInitV3()', [StringComparison]::Ordinal) -gt
                      $actual.IndexOf('__gcetItppAttachOnInitV3 = function()', [StringComparison]::Ordinal) -or
                    $code.Contains('handle.Cancel()') -or
                    $code.Contains('schedule.Every(')) {
                  $state = [ordered]@{
                    marker=$actual.Contains('__gcetItppDormantFrameV1')
                    frameBody=$actual.Contains('local function __gcetItppFrameStepV1(delta)')
                    start=$actual.Contains('mod.__gcetItppDormancyV1.Start()')
                    stop=$actual.Contains('mod.__gcetItppDormancyV1.Stop()')
                    toggle=$actual.Contains('mod.__gcetItppDormancyV1.Signal("toggle")')
                    fallback=$actual.Contains('if not __gcetItppWorkerFactoryV3 then')
                    pause=$code.Contains('handle.Pause()')
                    resume=$code.Contains('handle.Resume()')
                    nativeFallback=$code.Contains('nativeKeyFallback = hasNativeBindings()')
                    frameJob=$code.Contains('id="itp.frame"')
                    register=$code.Contains('function M.Register()')
                    inactive=$code.Contains('active=false')
                    deferredRegister=$actual.Contains('local ready = controller.Register()')
                    startBody=$actual.Contains('  if mod.__gcetItppDormancyV1 then mod.__gcetItppDormancyV1.Start() end' + "`n" + 'end)')
                    afterOnInit=$actual.IndexOf('local ready = controller.Register()', [StringComparison]::Ordinal) -gt
                        $actual.IndexOf('  if mod.__gcetItppDormancyV1 then mod.__gcetItppDormancyV1.Start() end' + "`n" + 'end)',[StringComparison]::Ordinal)
                    beforeUi=$actual.IndexOf('local ready = controller.Register()', [StringComparison]::Ordinal) -lt
                        $actual.IndexOf('local UI = {',[StringComparison]::Ordinal)
                    noCancel=!$code.Contains('handle.Cancel()')
                    noTimedJob=!$code.Contains('schedule.Every(')
                  }
                  Write-Host ('ITP_OUTPUT_PROOF_FLAGS: ' + ($state|ConvertTo-Json -Compress))
                  throw 'ITP_IDLE_WORKER_INCOMPLETE: active frame, deferred onInit source owner, direct wake or fallback lost'
                }
                Write-Host 'ITP untouched original: one pausable frame job, direct CET wake and native-key fail-open PASS'
              }
              Write-Host 'ITP original camera source: literal ID cache and original per-frame work verified'
            }
          }

          # Phase 3: assert the same original-source producers are optimized
          # by the existing AutoLoot and f80h rules, not by a repair layer.
          $lootOriginal = Join-Path $mods 'AutoLoot/modules/logic.lua'
          if (Test-Path -LiteralPath $lootOriginal) {
            $original = Get-Content -LiteralPath $lootOriginal -Raw
            if ($original.Contains('pcall(function() gameObjOwner = gameObj:GetOwner() end)')) {
              $file = Join-Path $output 'bin/x64/plugins/cyber_engine_tweaks/mods/AutoLoot/modules/logic.lua'
              if (!(Test-Path -LiteralPath $file)) {
                throw 'AUTOLOOT_GC_OUTPUT_MISSING: pristine protected owner path not generated'
              }
              $lua = Get-Content -LiteralPath $file -Raw
              if (!$lua.Contains('local function __gcetAutoLootProtectedOwnerV1(obj)') -or
                  !$lua.Contains('pcall(__gcetAutoLootProtectedOwnerV1, gameObj)') -or
                  !$lua.Contains('if __gcetOwnerOk then gameObjOwner = __gcetOwnerValue end') -or
                  $lua.Contains('pcall(function() gameObjOwner = gameObj:GetOwner() end)') -or
                  !$lua.Contains('transactionSystem:GetItemList(gameObjOwner)')) {
                throw 'AUTOLOOT_GC_OUTPUT_INCOMPLETE: lost protected native owner fallback or original inventory query'
              }
              Write-Host 'AutoLoot pristine: protected native owner lookup allocation and inventory semantics verified'
            }
          }
          $f80hOriginal = Join-Path $mods 'f80h_aroused_expressions/init.lua'
          if (Test-Path -LiteralPath $f80hOriginal) {
            $original = Get-Content -LiteralPath $f80hOriginal -Raw
            if ($original.Contains('local rule = resolveAllowRule(app, anchor)') -and
                $original.Contains('local p = safeGetPos(self)')) {
              $file = Join-Path $output 'bin/x64/plugins/cyber_engine_tweaks/mods/f80h_aroused_expressions/init.lua'
              if (!(Test-Path -LiteralPath $file)) {
                throw 'F80H_LOCATION_GC_OUTPUT_MISSING: pristine NPC anchor registration not generated'
              }
              $lua = Get-Content -LiteralPath $file -Raw
              if (!$lua.Contains('__gcetF80hAnchorPositionV1') -or
                  !$lua.Contains('local __gcetAnchorDistSquared = distSq(p, anchor)') -or
                  !$lua.Contains('and resolveAllowRule(app, anchor) or nil') -or
                  !$lua.Contains('pending[id.hash] = { npc = self, anchor = anchor, since = 0 }') -or
                  !$lua.Contains('startTrackingNPC(self, anchor, rule)') -or
                  !$lua.Contains('__gcetF80hCanSkipNew()') -or
                  !$lua.Contains('__gcetVarianceDispose') -or
                  $lua.Contains('local at   = isAtAnchor(self, anchor)')) {
                throw 'F80H_LOCATION_GC_OUTPUT_INCOMPLETE: native wake, pending, tracked or safe local matching lost'
              }
              Write-Host 'f80h pristine: native FAR bridge, active-GC and NPC-local anchor check preserved'
            }
          }

          # SPECTER is a campaign plus persistent interceptor; the M10
          # recovery sidecar must keep every-frame story handoff but skip
          # unnecessary unrelated owner/PhoneSystem lookups when inactive.
          $specterOriginal = Join-Path $mods 'SpecterM11RecoveryDev/init.lua'
          if (Test-Path -LiteralPath $specterOriginal) {
            $author = Get-Content -LiteralPath $specterOriginal -Raw
            if ($author.Contains('local function metricGet(ns,key,default)') -and
                $author.Contains('local seq=metricGet(STORY_NS,"specter_story_sequence",0)')) {
              $emittedPath = Join-Path $output 'bin/x64/plugins/cyber_engine_tweaks/mods/SpecterM11RecoveryDev/init.lua'
              if (!(Test-Path -LiteralPath $emittedPath)) {
                throw 'SPECTER_RECOVERY_GC_OUTPUT_MISSING: expected untouched recovery source transformation'
              }
              $produced = Get-Content -LiteralPath $emittedPath -Raw
              if (!$produced.Contains('__gcetSpecterMetricCoreOnlyV1') -or
                  !$produced.Contains('pcall(core.State.get,ns,key,default)') -or
                  !$produced.Contains('pcall(core.Bus.getMetric,ns,key,default)') -or
                  !$produced.Contains('if seq==9 and rainbowDone==1 and recoveryDone==0 then') -or
                  !$produced.Contains('refresh()') -or
                  !$produced.Contains('autoStartClock>=0.75') -or
                  $produced.Contains('pcall(function() return core.State.get(ns,key,default) end)')) {
                throw 'SPECTER_RECOVERY_GC_INCOMPLETE: core metric shortcut or same-frame M9 handoff lost'
              }
              $musicOriginal = Join-Path $mods 'SpecterM11RecoveryDev/specter_mission_music.lua'
              if (Test-Path -LiteralPath $musicOriginal) {
                $originalMusic = Get-Content -LiteralPath $musicOriginal -Raw
                if ($originalMusic.Contains('pending={}') -and
                    $originalMusic.Contains('local function flush(bus)') -and
                    $originalMusic.Contains('if M.owner then M.stop(bus) else flush(bus) end')) {
                  if (!$produced.Contains('__gcetSpecterIdleMusicBusV1') -or
                      !$produced.Contains('next(Music.pending) ~= nil) and phoneBus() or nil')) {
                    throw 'SPECTER_MUSIC_WAKE_INCOMPLETE: active or pending music no longer proven'
                  }
                }
              }
              Write-Host 'SPECTER source-owned core-only metric read, active handoff and pending music bus proof PASS'
            }
          }


          # Phase 3 targeted source proof: archive inventory is not enough.
          # Verify this combined pass emitted all source-owned hotpath stages
          # directly from the private original stack, never an optimized input.
          $ziggyOriginal = Join-Path $mods 'ziggy_last_play/init.lua'
          if (Test-Path -LiteralPath $ziggyOriginal) {
            $author = Get-Content -LiteralPath $ziggyOriginal -Raw
            if ($author.Contains('xpcall(function()update(dt)end,function(e)return tostring(e)end)')) {
              $file = Join-Path $output 'bin/x64/plugins/cyber_engine_tweaks/mods/ziggy_last_play/init.lua'
              if (!(Test-Path -LiteralPath $file)) { throw 'ZIGGY_GC_OUTPUT_MISSING' }
              $lua = Get-Content -LiteralPath $file -Raw
              if (!$lua.Contains('G-CET semantic:ziggy-no-frame-closure-v7') -or
                  !$lua.Contains('local ok,err=pcall(update,dt)') -or
                  !$lua.Contains('if not ok then err=tostring(err) end') -or
                  !$lua.Contains('__gcetZiggyOfferedFarAcc') -or
                  !$lua.Contains('__gcetZiggyNativeOfferedFar') -or
                  $lua.Contains('xpcall(function()update(dt)end')) {
                throw 'ZIGGY_GC_OUTPUT_INCOMPLETE: author error recovery or native wake lost'
              }
              Write-Host 'Ziggy pristine: native offered-far wake and no-frame-closure error handling PASS'
            }
          }
          $npcOriginal = Join-Path $mods 'NPC Outfit Manager/init.lua'
          if (Test-Path -LiteralPath $npcOriginal) {
            $author = Get-Content -LiteralPath $npcOriginal -Raw
            if ($author.Contains('local function ProcessRadarOutfits()') -and
                $author.Contains('activeNPCs[entId] = self')) {
              $file = Join-Path $output 'bin/x64/plugins/cyber_engine_tweaks/mods/NPC Outfit Manager/init.lua'
              if (!(Test-Path -LiteralPath $file)) { throw 'NPC_OUTFIT_RADAR_OUTPUT_MISSING' }
              $lua = Get-Content -LiteralPath $file -Raw
              if (!$lua.Contains('local __gcetNpcRadarQueueV2 = {}') -or
                  !$lua.Contains('local scan = fullSweep and activeNPCs or __gcetNpcRadarQueueV2') -or
                  !$lua.Contains('__gcetNpcRadarSweepV2 >= 10.0') -or
                  !$lua.Contains('__gcetNpcRadarRulesChangedV2()') -or
                  !$lua.Contains('__gcetNpcRadarQueueV2[entId] = self') -or
                  !$lua.Contains('__gcetNpcRadarQueueV2[entId] = nil') -or
                  !$lua.Contains('ProcessRadarOutfits()') -or
                  !$lua.Contains('ApplyLookByIndex(npc, lookupId, slotStr, true)')) {
                throw 'NPC_OUTFIT_RADAR_INCOMPLETE: event/rule wake or outfit application lost'
              }
              Write-Host 'NPC Outfit Manager pristine: candidate queue, rule mutation, fallback and application PASS'
            }
          }
          $elmOriginal = Join-Path $mods 'ELM_ImmersiveWay/init.lua'
          if (Test-Path -LiteralPath $elmOriginal) {
            $author = Get-Content -LiteralPath $elmOriginal -Raw
            if ($author.Contains('    SceneInteraction.Update()') -and
                $author.Contains('    safeCall("DarkFuture TickScene"')) {
              $base = Join-Path $output 'bin/x64/plugins/cyber_engine_tweaks/mods/ELM_ImmersiveWay'
              $generatedInit = Join-Path $base 'init.lua'
              $generatedScene = Join-Path $base 'elm_scene_interaction.lua'
              $generatedXp = Join-Path $base 'elm_earnxp.lua'
              foreach ($file in @($generatedInit,$generatedScene,$generatedXp)) {
                if (!(Test-Path -LiteralPath $file)) { throw 'ELM_GC_OUTPUT_MISSING: incomplete owned 3-file emission' }
              }
              $main = Get-Content -LiteralPath $generatedInit -Raw
              $scene = Get-Content -LiteralPath $generatedScene -Raw
              $xp = Get-Content -LiteralPath $generatedXp -Raw
              if (!$main.Contains('G-CET semantic:elm-immersiveway-idle-gc-v1') -or
                  !$main.Contains('SceneInteraction.GCET_IsUiActive()') -or
                  !$main.Contains('EarnXP.GCET_IsActive()') -or
                  !$main.Contains('    SceneInteraction.Update()') -or
                  !$scene.Contains('return shown or ui.hubShown or ui.refreshPending or ui.input') -or
                  !$scene.Contains('function SceneInteraction.Show(choiceUniqueID)') -or
                  !$scene.Contains('function SceneInteraction.Hide()') -or
                  !$xp.Contains('function EarnXP.GCET_IsActive()') -or
                  !$xp.Contains('function EarnXP.Tick(delta)')) {
                throw 'ELM_GC_OUTPUT_INCOMPLETE: native choices, active UI or XP timer path lost'
              }
              Write-Host 'ELM pristine: active custom interaction and earned timers plus idle fast path PASS'
            }
          }

          # Use the ACTUAL generated current-source ITP, not a stock-only
          # synthetic marker fixture, to verify idempotence, missing-worker
          # recovery and unsafe drift handling.
          ./tests/ImmersiveThirdPersonDormancyStagedContract.ps1 -ResolverExe './ci-resolver/G-CET-Resolver.exe' -OriginalMods $mods -Capture $capture -GeneratedRoot $output

      - name: Remove temporary private source
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath 'ci-private-stack' -Recurse -Force -ErrorAction SilentlyContinue
