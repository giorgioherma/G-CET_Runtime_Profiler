name: DAV Staged Native Action Source Regression

on:
  push:
    branches:
      - fix/dav-staged-native-action-20261016
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staged-native-action:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile Resolver and semantic catalog
        run: dotnet build G-CET-Runtime-Profiler.sln -c Release
      - name: Validate semantic source contracts
        shell: pwsh
        run: |
          ./tests/SemanticModPassOwnershipContract.ps1
          ./tests/SemanticLibraryContract.ps1
      - name: Publish isolated regression Resolver
        run: dotnet publish src/G.CETResolver.App/G.CETResolver.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o publish-resolver
      - name: Pristine and staged CRLF semantic generation contracts
        shell: pwsh
        run: ./tests/HotscenesDavActionSourceContract.ps1 -ResolverRoot ./publish-resolver
