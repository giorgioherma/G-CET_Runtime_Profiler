name: Rebuild G-CET native profiler

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
  push:
    branches: [ dev/resolver-profiler-handoff ]
    paths:
      - 'native-profiler-build/**'
      - '.github/workflows/native-profiler-rebuild.yml'

jobs:
  rebuild:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Rebuild native profiler from pinned CET source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./native-profiler-build/v2.11.0/Build-Profiler.ps1 -WorkRoot "$env:RUNNER_TEMP\gcet-native-rebuild"

      - name: Stage rebuilt payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'native-profiler-build\v2.11.0\BUILD_OUTPUT\cyber_engine_tweaks.PROFILER.asi'
          if (!(Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Rebuilt profiler ASI was not found: $source"
          }

          New-Item -ItemType Directory -Force native-rebuild-artifact | Out-Null
          Copy-Item $source native-rebuild-artifact\cyber_engine_tweaks.PROFILER.dll -Force

          $hash = (Get-FileHash native-rebuild-artifact\cyber_engine_tweaks.PROFILER.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  cyber_engine_tweaks.PROFILER.dll" | Set-Content native-rebuild-artifact\SHA256.txt -Encoding ascii
          Write-Host "Rebuilt profiler SHA256: $hash"

      - name: Commit rebuilt payload to resolver branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $rebuilt = 'native-rebuild-artifact\cyber_engine_tweaks.PROFILER.dll'
          if (!(Test-Path -LiteralPath $rebuilt -PathType Leaf)) {
            throw "Rebuilt profiler payload is missing: $rebuilt"
          }

          # Native compilation takes several minutes. The branch may advance
          # meanwhile, so rebase onto its latest tip before staging generated
          # files. This avoids unrelated docs/test commits causing a rejected
          # non-fast-forward push after a successful native build.
          git fetch origin dev/resolver-profiler-handoff
          git rebase origin/dev/resolver-profiler-handoff

          Copy-Item $rebuilt 'payload\cyber_engine_tweaks.PROFILER.dll' -Force
          $hash = (Get-FileHash 'payload\cyber_engine_tweaks.PROFILER.dll' -Algorithm SHA256).Hash.ToLowerInvariant()

          $manifestPath = 'MANIFEST.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw
          $updated = [regex]::Replace(
            $manifest,
            '"profilerSha256"\s*:\s*"[0-9a-fA-F]{64}"',
            ('"profilerSha256": "' + $hash + '"'),
            1)

          if ($updated -eq $manifest) {
            throw 'Could not update profilerSha256 in MANIFEST.json.'
          }

          Set-Content -LiteralPath $manifestPath -Value $updated -Encoding utf8 -NoNewline

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- payload/cyber_engine_tweaks.PROFILER.dll MANIFEST.json

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Rebuilt payload already matches the branch.'
          }
          else {
            git commit -m "build: refresh resolver onUpdate native profiler payload"
            git push origin HEAD:dev/resolver-profiler-handoff
          }

      - name: Upload rebuilt native payload
        uses: actions/upload-artifact@v4
        with:
          name: gcet-native-profiler-resolver-onupdate
          path: native-rebuild-artifact/
          if-no-files-found: error
