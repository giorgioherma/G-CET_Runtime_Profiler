name: Rebuild G-CET native profiler

permissions:
  contents: read
  actions: read

# Native CI only compiles and uploads the native DLL and checksum.
# The Profiler/Resolver build consumes a pinned successful native artifact.
# Deliberate, MANUAL ONLY CET C++ build. All routine edits reuse the pinned ASI.
# Never auto-compile CET on push (including native source changes).
on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Block native rebuild without a source delta against pinned package ASI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/dev/resolver-profiler-handoff') {
            throw 'Native development builds must use the authoritative dev branch.'
          }
          # Last deliberately pinned native DLL's source commit, as recorded in
          # .github/workflows/build.yml. Packaging never recompiles CET.
          $pinnedNativeSource = 'ed79408c3e79335a379b2078416b4f244961a3a5'
          $sourceInputs = @(
            'native-profiler-build/v2.11.0/Build-Profiler.ps1',
            'native-profiler-build/v2.11.0/CETRuntimeProfiler.h',
            'native-profiler-build/v2.11.0/Check-Historical-Toolchain.ps1',
            'native-profiler-build/v2.11.0/Patch-CET-BuildDependencies.ps1',
            'native-profiler-build/v2.11.0/Patch-CET-HistoricalBuild.ps1',
            'native-profiler-build/v2.11.0/Patch-CET-v1.37.1.ps1',
            'native-profiler-build/v2.11.0/Patch-LuaJIT-GC-Source.ps1'
          )
          $changed = @(git diff --name-only $pinnedNativeSource HEAD -- $sourceInputs)
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify native source changes against the pinned compiled ASI.' }
          if ($changed.Count -eq 0) {
            throw 'Native generating source is unchanged from the pinned compiled ASI. Reuse it; no CET rebuild allowed.'
          }
          Write-Host 'Manual native rebuild requested with generating-source changes:'
          $changed | ForEach-Object { Write-Host "  $_" }

      - name: Record native source identity
        shell: pwsh
        run: |
          "GGC_SOURCE_HASH=$(git hash-object native-profiler-build/v2.11.0/Patch-LuaJIT-GC-Source.ps1)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "GGC_HEADER_HASH=$(git hash-object native-profiler-build/v2.11.0/CETRuntimeProfiler.h)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify 0-Engine source attribution contract
        shell: pwsh
        run: python tests/test_native_zeroengine_source.py

      - name: Rebuild native profiler from pinned CET source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./native-profiler-build/v2.11.0/Build-Profiler.ps1 -WorkRoot "$env:RUNNER_TEMP\gcet-native-rebuild"

      - name: Stage rebuilt payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'native-profiler-build\v2.11.0\BUILD_OUTPUT\cyber_engine_tweaks.PROFILER.asi'
          if (!(Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Rebuilt profiler ASI was not found: $source"
          }

          New-Item -ItemType Directory -Force native-rebuild-artifact | Out-Null
          Copy-Item $source native-rebuild-artifact\cyber_engine_tweaks.PROFILER.dll -Force

          $hash = (Get-FileHash native-rebuild-artifact\cyber_engine_tweaks.PROFILER.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  cyber_engine_tweaks.PROFILER.dll" | Set-Content native-rebuild-artifact\SHA256.txt -Encoding ascii
          Write-Host "Rebuilt profiler SHA256: $hash"
          @('NativeProfilerVersion=2.16.1', 'CETCompatibility=1.37.1', "DLL_SHA256=$hash") |
            Set-Content native-rebuild-artifact/NATIVE_VERSION.txt -Encoding ascii
          # Experimental developer symbols are a separate artifact, never imported
          # into the player-facing Profiler/Resolver packages.
          $pdb = 'native-profiler-build/v2.11.0/BUILD_OUTPUT/cyber_engine_tweaks.PROFILER.pdb'
          if (!(Test-Path -LiteralPath $pdb -PathType Leaf)) {
            throw 'Profiler PDB missing from this build. Cannot symbolicate native sample RVAs safely.'
          }
          New-Item -ItemType Directory -Force native-debug-symbols | Out-Null
          Copy-Item -LiteralPath $pdb -Destination native-debug-symbols/cyber_engine_tweaks.PROFILER.pdb -Force
          $pdbHash = (Get-FileHash native-debug-symbols/cyber_engine_tweaks.PROFILER.pdb -Algorithm SHA256).Hash.ToLowerInvariant()
          "$pdbHash  cyber_engine_tweaks.PROFILER.pdb" | Set-Content native-debug-symbols/SHA256.txt -Encoding ascii
          "$hash  cyber_engine_tweaks.PROFILER.dll" | Set-Content native-debug-symbols/DLL_SHA256.txt -Encoding ascii
          Write-Host "Matching PDB SHA256: $pdbHash"

      - name: Verify compiled native payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $native = 'native-rebuild-artifact/cyber_engine_tweaks.PROFILER.dll'
          $actual = (Get-FileHash -LiteralPath $native -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashLine = (Get-Content native-rebuild-artifact/SHA256.txt -Raw).Trim()
          if (!$hashLine.StartsWith($actual + ' ')) { throw 'Native artifact SHA sidecar does not match DLL.' }
          $nativeInfo = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $native).Path)
          if ($nativeInfo.FileMajorPart -ne 2 -or $nativeInfo.FileMinorPart -ne 16 -or
              $nativeInfo.FileBuildPart -ne 1 -or $nativeInfo.ProductVersion -ne '2.16.1' -or
              $nativeInfo.FileDescription -ne 'G-CET Native Runtime Profiler (CET 1.37.1)') {
            throw "Compiled native VERSIONINFO mismatch: $($nativeInfo.FileVersion) / $($nativeInfo.ProductVersion)"
          }
          $pe = ./native-profiler-build/v2.11.0/Get-CETPEInfo.ps1 -Path $native
          if ($pe.Linker -ne '14.44') { throw "Native linker differs from the historical toolchain: $($pe.Linker)" }
          $source = Get-Content native-profiler-build/v2.11.0/CETRuntimeProfiler.h -Raw
          $patch = Get-Content native-profiler-build/v2.11.0/Patch-CET-v1.37.1.ps1 -Raw
          if (!$source.Contains('CET_Runtime_Profile_Scalar_Observations.csv') -or
              !$source.Contains('bool ObserveScalar(') -or
              !$patch.Contains('globals["CETProfilerObserveScalar"]')) {
            throw 'Native source does not contain expected scalar observation API/CSV contract.'
          }
          foreach ($marker in @('CET_Runtime_Profile_GGC_UnscopedReallocOrigins.csv',
                                 'OLD_SIZE_NONZERO', 'CET_DRAW_DISPATCH',
                                 'CET_LIFECYCLE_DISPATCH', 'CET_OVERLAY_EVENT_DISPATCH')) {
            if (!$source.Contains($marker) -and !$patch.Contains($marker)) {
              throw "New native attribution marker missing in source: $marker"
            }
          }
          # Verify both attribution report paths made it into the DLL.
          # Source-only matches are insufficient (can accidentally ship stale binaries).
          $binary = [Text.Encoding]::Latin1.GetString(
              [IO.File]::ReadAllBytes((Resolve-Path $native).Path))
          foreach ($marker in @(
              'CET_Runtime_Profile_ZeroEngine_SourceAttribution.csv',
              'CET_Runtime_Profile_ZeroEngine_Callsites.csv',
              'CET_Runtime_Profile_ZeroEngine_ProducerAttribution.csv',
              'CET_Runtime_Profile_ZeroEngine_ConsumerCallsites.csv',
               'CET_Runtime_Profile_ZeroEngine_PressureCandidates.csv',
              'CET_Runtime_Profile_LuaNative_Callsites.csv',
              'CET_Runtime_Profile_Native_PreDispatchPressure.csv',
              'CET_Runtime_Profile_Native_MethodStages.csv',
              'sampled-child-inclusive-overlap-not-additive')) {
            if (!$source.Contains($marker) -or !$binary.Contains($marker)) {
              throw "Compiled 0-Engine attribution marker missing: $marker"
            }
          }
          # Report signing status explicitly; a version stamp is not a security verdict.
          $signature = Get-AuthenticodeSignature -FilePath $native
          Write-Host "Experimental native Authenticode status: $($signature.Status)"
          if ($signature.Status -ne 'Valid') {
            Write-Warning 'Unsigned/untrusted native DLL may trigger browser reputation warnings. Do not bypass security warnings.'
          }
          Write-Host "Compiled native DLL verified: $actual"

      - name: Upload rebuilt native payload
        uses: actions/upload-artifact@v6
        with:
          name: gcet-native-experimental-scalar-observations
          path: native-rebuild-artifact/
          if-no-files-found: error

      - name: Upload developer-only matching debug symbols
        uses: actions/upload-artifact@v6
        with:
          name: gcet-native-experimental-debug-symbols
          path: native-debug-symbols/
          if-no-files-found: error
