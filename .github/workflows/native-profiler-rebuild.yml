# This 2.5 branch only uploads test artifacts. Never commits or overwrites the 2.31 main payload.
name: Rebuild G-CET native profiler

permissions:
  contents: read
  actions: read

# MANUAL ONLY. Editing Lua/C#/docs/tests never queues a CET C++ rebuild.
# The verified, SHA256-pinned ASI remains the packaging input until deliberately changed.
on:
  workflow_dispatch:

# Native rebuilds are separate from fast packaging: no main release updates.
concurrency:
  group: gcet-cp25-native-manual
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse rebuild without changed CET native generating inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/cyberpunk-2.5-cet-1.38.1') {
            throw '2.5 native rebuild only accepts its isolated 2.5 source branch.'
          }
          # This commit produced the currently pinned and successfully built ASI.
          # Ordinary app/Lua/test/docs changes must NEVER trigger recompilation.
          $nativeSourcePin = '8b7f743c3aa9874cc16c58b2efa4ce950f5b6a1f'
          $nativeGeneratingInputs = @(
            'native-profiler-build/v2.11.0/CETRuntimeProfiler.h',
            'native-profiler-build/v2.11.0/Patch-CET-v1.37.1.ps1',
            'native-profiler-build/v2.11.0/Patch-CET-HistoricalBuild.ps1',
            'native-profiler-build/v2.11.0/Patch-CET-BuildDependencies.ps1',
            'native-profiler-build/v2.11.0/Build-Profiler.ps1',
            'native-profiler-build/v2.11.0/Check-Historical-Toolchain.ps1'
          )
          $changed = @(git diff --name-only $nativeSourcePin HEAD -- $nativeGeneratingInputs)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compare native generating inputs to pinned ASI source.' }
          if ($changed.Count -eq 0) {
            throw 'No native generating input changed since the pinned ASI. Refusing expensive CET recompilation.'
          }
          Write-Host 'Explicit native rebuild authorized by source changes:'
          $changed | ForEach-Object { Write-Host "  $_" }

      - name: Rebuild native profiler from pinned CET source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./native-profiler-build/v2.11.0/Build-Profiler.ps1 -WorkRoot "$env:RUNNER_TEMP\gcet-native-rebuild"

      - name: Stage rebuilt payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'native-profiler-build\v2.11.0\BUILD_OUTPUT\cyber_engine_tweaks.PROFILER.asi'
          if (!(Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Rebuilt profiler ASI was not found: $source"
          }

          New-Item -ItemType Directory -Force native-rebuild-artifact | Out-Null
          Copy-Item $source native-rebuild-artifact\cyber_engine_tweaks.PROFILER.dll -Force
          $control = "native-profiler-build\v2.11.0\BUILD_OUTPUT\cyber_engine_tweaks.CONTROL.asi"
          if (!(Test-Path -LiteralPath $control -PathType Leaf)) { throw "Unmodified CET control build missing" }
          Copy-Item $control native-rebuild-artifact\cyber_engine_tweaks.CONTROL.asi -Force
          $pdb = 'native-profiler-build\v2.11.0\BUILD_OUTPUT\cyber_engine_tweaks.PROFILER.pdb'
          if (!(Test-Path -LiteralPath $pdb -PathType Leaf)) {
            throw "Matching profiler PDB was not found: $pdb"
          }
          Copy-Item $pdb native-rebuild-artifact\cyber_engine_tweaks.PROFILER.pdb -Force

          $hash = (Get-FileHash native-rebuild-artifact\cyber_engine_tweaks.PROFILER.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  cyber_engine_tweaks.PROFILER.dll" | Set-Content native-rebuild-artifact\SHA256.txt -Encoding ascii
          $pdbHash = (Get-FileHash native-rebuild-artifact\cyber_engine_tweaks.PROFILER.pdb -Algorithm SHA256).Hash.ToLowerInvariant()
          "$pdbHash  cyber_engine_tweaks.PROFILER.pdb" | Add-Content native-rebuild-artifact\SHA256.txt -Encoding ascii
          Write-Host "Rebuilt profiler SHA256: $hash"

      - name: Upload rebuilt native payload
        uses: actions/upload-artifact@v4
        with:
          name: gcet-native-profiler-cet-1.38.1-cp-2.5
          path: native-rebuild-artifact/
          if-no-files-found: error
